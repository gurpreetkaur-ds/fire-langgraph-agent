# Fire LangGraph Agent: public HTTPS reverse proxy to uvicorn on 127.0.0.1:8310.
# Access logs omit URLs and bodies, so questions and answers never land in Apache logs.
LogFormat "%h %t \"%m\" %>s %b %D" agent_nourl

<VirtualHost *:80>
    ServerName @HOST@
    DocumentRoot /var/www/html/public
    RedirectMatch 301 "^/(?!\.well-known/acme-challenge/)" "https://@HOST@/"
    ErrorLog ${APACHE_LOG_DIR}/agent-error.log
    CustomLog ${APACHE_LOG_DIR}/agent-access.log agent_nourl
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName @HOST@
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/@HOST@/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/@HOST@/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder off
    SSLSessionTickets off
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    <If "%{HTTP_HOST} != '@HOST@'">
        Require all denied
    </If>
    LimitRequestBody 65536
    # Document uploads (the app enforces MAX_UPLOAD_MB per file and 10 files per request; this is the outer cap).
    <Location "/api/documents">
        LimitRequestBody 157286400
    </Location>
    # Answers stream as Server-Sent Events: don't buffer, allow a few minutes per question.
    SetEnv proxy-sendchunked 1
    ProxyPass        "/" "http://127.0.0.1:8310/" timeout=300 retry=0 flushpackets=on
    ProxyPassReverse "/" "http://127.0.0.1:8310/"

    ErrorLog ${APACHE_LOG_DIR}/agent-error.log
    CustomLog ${APACHE_LOG_DIR}/agent-access.log agent_nourl
</VirtualHost>
</IfModule>
